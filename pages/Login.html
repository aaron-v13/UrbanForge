<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | UrbanForge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../css/login.css">
    <link rel="shortcut icon" href="../assets/image/Favicon.png" type="image/x-icon">
</head>

<body>
    <main class="login-card">
        <a class="logo" href="../index.html">
            <img src="../assets/image/backrem-Photoroom.png" alt="UrbanForge">
        </a>

        <h1>Welcome <span>Back!</span></h1>
        <p class="subtitle">Sign in to continue to your account</p>

        <form id="loginForm" novalidate>
            <div class="field">
                <div class="input-box">
                    <i class="fa-regular fa-envelope"></i>
                    <input type="email" name="email" id="email" placeholder="Email address" autocomplete="email" required>
                </div>
                <small class="error" id="emailError"></small>
            </div>

            <div class="field">
                <div class="input-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" id="password" placeholder="Password" autocomplete="current-password" required>
                    <i class="fa-regular fa-eye toggle" id="togglePassword" role="button" aria-label="Show password"></i>
                </div>
                <small class="error" id="passwordError"></small>
            </div>

            <div class="remember-row">
                <label class="remember">
                    <input type="checkbox" id="rememberme">
                    <span>Remember me</span>
                </label>
                <a class="link" href="#">Forgot Password?</a>
            </div>

            <button type="submit" class="signin" id="signinBtn">Sign In</button>
            <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>

        <div class="or-divider">
            <span></span>
            <p>OR</p>
            <span></span>
        </div>

        <div class="social-buttons">
            <button type="button" class="social-btn" data-provider="Google">
                <i class="fa-brands fa-google"></i>
                <span>Continue with Google</span>
            </button>
            <button type="button" class="social-btn" data-provider="GitHub">
                <i class="fa-brands fa-github"></i>
                <span>Continue with GitHub</span>
            </button>
        </div>

        <p class="createacc">
            <span>Don't have an account?</span>
            <a class="link" href="#">Create Account</a>
        </p>
    </main>

    <script src="../js/login.js"></script>
</body>

</html>
